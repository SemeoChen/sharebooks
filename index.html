<html lang="zh-TW" data-theme="dark">
<head>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-sans: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            
            /* Dark Theme Colors */
            --bg-body: #0b0f19;
            --bg-card: rgba(22, 30, 49, 0.75);
            --bg-card-hover: rgba(30, 41, 67, 0.85);
            --border-card: rgba(255, 255, 255, 0.08);
            --border-card-hover: rgba(99, 102, 241, 0.4);
            
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --text-dim: #6b7280;
            
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: rgba(99, 102, 241, 0.15);
            --accent: #ec4899;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            
            --glass-bg: rgba(17, 24, 39, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 20px 40px -15px rgba(99, 102, 241, 0.3);
            
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-body: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-hover: #ffffff;
            --border-card: rgba(0, 0, 0, 0.06);
            --border-card-hover: rgba(99, 102, 241, 0.5);
            
            --text-main: #0f172a;
            --text-muted: #475569;
            --text-dim: #94a3b8;
            
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.08);
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 20px 35px -10px rgba(99, 102, 241, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(236, 72, 153, 0.06) 0%, transparent 40%);
            background-attachment: fixed;
            transition: background-color 0.4s ease;
        }

        /* Navbar & Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: var(--glass-bg);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 2rem;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            background: var(--accent-gradient);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .brand-text h1 {
            font-size: 1.35rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .brand-text p {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .badge-count {
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid var(--border-card-hover);
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .theme-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .theme-btn:hover {
            transform: rotate(15deg) scale(1.05);
            border-color: var(--primary);
        }

        /* Hero Banner */
        .hero {
            max-width: 1400px;
            margin: 2.5rem auto 1.5rem auto;
            padding: 0 2rem;
            text-align: center;
        }

        .hero h2 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.8rem;
            letter-spacing: -1px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 700px;
            margin: 0 auto 2rem auto;
        }

        /* Search & Filter Controls */
        .controls-section {
            max-width: 1400px;
            margin: 0 auto 2.5rem auto;
            padding: 0 2rem;
        }

        .search-box-wrapper {
            position: relative;
            max-width: 650px;
            margin: 0 auto 1.5rem auto;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 1.2rem;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 54px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 99px;
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-card);
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light), var(--shadow-hover);
        }

        /* Category Filter Pills */
        .category-filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-pill {
            padding: 8px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 99px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        .filter-pill:hover {
            color: var(--text-main);
            border-color: var(--border-card-hover);
            transform: translateY(-2px);
        }

        .filter-pill.active {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
        }

        /* Stats Bar */
        .stats-summary {
            max-width: 1400px;
            margin: 0 auto 1.5rem auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Books Grid */
        .books-grid {
            max-width: 1400px;
            margin: 0 auto 4rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* Book Card */
        .book-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-card);
            transition: var(--transition);
            position: relative;
            cursor: pointer;
        }

        .book-card:hover {
            transform: translateY(-8px);
            border-color: var(--border-card-hover);
            box-shadow: var(--shadow-hover);
            background: var(--bg-card-hover);
        }

        .cover-container {
            width: 100%;
            height: 320px;
            background: rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .cover-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: var(--radius-sm);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s ease;
        }

        .book-card:hover .cover-image {
            transform: scale(1.05);
        }

        .category-tag {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .card-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .book-id-badge {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .book-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-subtitle {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book-meta {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .book-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 1.25rem;
            flex-grow: 1;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .btn {
            padding: 10px 16px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            width: 100%;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-card);
            color: var(--text-main);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Modal Dialog */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background: var(--bg-body);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 2rem;
            padding: 2rem;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--accent);
            color: white;
        }

        .modal-cover-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-md);
            padding: 1.5rem;
        }

        .modal-cover-wrap img {
            max-width: 100%;
            max-height: 450px;
            object-fit: contain;
            border-radius: var(--radius-sm);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .modal-info {
            display: flex;
            flex-direction: column;
        }

        .modal-category {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            align-self: flex-start;
        }

        .modal-title {
            font-size: 1.75rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 6px;
        }

        .modal-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .modal-details-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .modal-details-table td {
            padding: 8px 0;
            border-bottom: 1px solid var(--border-card);
        }

        .modal-details-table td:first-child {
            color: var(--text-dim);
            width: 90px;
            font-weight: 600;
        }

        .modal-desc-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal-desc-text {
            font-size: 0.92rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            color: var(--text-dim);
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border-card);
            padding: 2.5rem 2rem;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.88rem;
        }

        /* Responsive Breakpoints */
        @media (max-width: 850px) {
            .modal-container {
                grid-template-columns: 1fr;
                max-height: 95vh;
            }
            .hero h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

        let booksData = EMBEDDED_BOOKS_DATA;
        let currentFilter = 'ALL';
        let searchQuery = '';

        // DOM Elements
        const gridEl = document.getElementById('books-grid');
        const searchInput = document.getElementById('search-input');
        const filtersEl = document.getElementById('category-filters');
        const totalBadge = document.getElementById('total-badge');
        const showingCountEl = document.getElementById('showing-count');
        const activeFilterLabel = document.getElementById('active-filter-label');
        const themeBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');

        // Modal Elements
        const modalOverlay = document.getElementById('modal-overlay');
        const modalClose = document.getElementById('modal-close');
        const modalImg = document.getElementById('modal-img');
        const modalCategory = document.getElementById('modal-category');
        const modalTitle = document.getElementById('modal-title');
        const modalSubtitle = document.getElementById('modal-subtitle');
        const modalAuthor = document.getElementById('modal-author');
        const modalPublisher = document.getElementById('modal-publisher');
        const modalFilename = document.getElementById('modal-filename');
        const modalDesc = document.getElementById('modal-desc');
        const modalUrlBtn = document.getElementById('modal-url-btn');

        // Initialize App
        async function init() {
            // Try fetching books_data.json if running on web server
            try {
                const res = await fetch('books_data.json');
                if (res.ok) {
                    const fetchedData = await res.json();
                    if (Array.isArray(fetchedData) && fetchedData.length > 0) {
                        booksData = fetchedData;
                    }
                }
            } catch (e) {
                console.log("Loaded embedded books data.");
            }

            renderCategories();
            renderGrid();
            setupEventListeners();
        }

        // Render Category Filter Pills
        function renderCategories() {
            const rawCategories = booksData.map(b => b.category);
            const uniqueCategories = ['全部', ...new Set(rawCategories)];

            filtersEl.innerHTML = uniqueCategories.map((cat, idx) => `
                <button class="filter-pill ${idx === 0 ? 'active' : ''}" data-category="${cat}">
                    ${cat}
                </button>
            `).join('');
        }

        // Render Books Grid
        function renderGrid() {
            const filtered = booksData.filter(book => {
                const matchesCategory = (currentFilter === 'ALL' || currentFilter === '全部' || book.category.includes(currentFilter));
                const q = searchQuery.toLowerCase();
                const matchesSearch = !q || 
                    book.title.toLowerCase().includes(q) ||
                    (book.subtitle && book.subtitle.toLowerCase().includes(q)) ||
                    book.author.toLowerCase().includes(q) ||
                    book.publisher.toLowerCase().includes(q) ||
                    book.category.toLowerCase().includes(q);

                return matchesCategory && matchesSearch;
            });

            showingCountEl.textContent = `顯示 ${filtered.length} / ${booksData.length} 本圖書`;
            totalBadge.textContent = `共 ${booksData.length} 本圖書`;

            if (filtered.length === 0) {
                gridEl.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                        <h3>找不到符合條件的圖書</h3>
                        <p style="margin-top:0.5rem; font-size:0.9rem;">請嘗試調整關鍵字或切換至「全部」分類。</p>
                    </div>
                `;
                return;
            }

            gridEl.innerHTML = filtered.map(book => `
                <div class="book-card" onclick="openModal(${book.id})">
                    <div class="cover-container">
                        <span class="category-tag">${escapeHtml(book.category.split('/')[0])}</span>
                        <img src="${escapeHtml(book.image)}" alt="${escapeHtml(book.title)}" class="cover-image" loading="lazy" onerror="this.src='https://via.placeholder.com/280x360?text=Book+Cover'">
                    </div>
                    <div class="card-body">
                        <span class="book-id-badge">#${String(book.id).padStart(2, '0')} · ${escapeHtml(book.filename)}</span>
                        <h3 class="book-title" title="${escapeHtml(book.title)}">${escapeHtml(book.title)}</h3>
                        ${book.subtitle ? `<div class="book-subtitle" title="${escapeHtml(book.subtitle)}">${escapeHtml(book.subtitle)}</div>` : '<div class="book-subtitle">&nbsp;</div>'}
                        
                        <div class="book-meta">
                            <span>✍️ ${escapeHtml(book.author)}</span>
                            <span>🏢 ${escapeHtml(book.publisher)}</span>
                        </div>

                        <p class="book-desc">${escapeHtml(book.description)}</p>

                        <div class="card-actions">
                            <button class="btn btn-outline" onclick="event.stopPropagation(); openModal(${book.id})">
                                🔍 查看詳情
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Open Modal
        window.openModal = function(id) {
            const book = booksData.find(b => b.id === id);
            if (!book) return;

            modalImg.src = book.image;
            modalCategory.textContent = book.category;
            modalTitle.textContent = book.title;
            modalSubtitle.textContent = book.subtitle || '（無副標題）';
            modalAuthor.textContent = book.author;
            modalPublisher.textContent = book.publisher;
            modalFilename.textContent = book.filename;
            modalDesc.textContent = book.description;
            modalUrlBtn.href = book.url;

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        // Close Modal
        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Event Listeners
        function setupEventListeners() {
            // Search Input
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderGrid();
            });

            // Category Filter Pills
            filtersEl.addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-pill')) {
                    document.querySelectorAll('.filter-pill').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.category;
                    activeFilterLabel.textContent = `目前分類：${currentFilter}`;
                    renderGrid();
                }
            });

            // Theme Toggle
            themeBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                themeIcon.textContent = newTheme === 'dark' ? '🌙' : '☀️';
            });

            // Modal Close Events
            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
        }

        // Utility
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
